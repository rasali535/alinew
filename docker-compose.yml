

# =====================================================================
# Rasali Labs — Docker Compose
# Docker Hub: hub.docker.com/u/rasali
# Local dev:  docker compose up -d --build
# Push:       docker compose push
# VPS deploy: docker compose pull && docker compose up -d
# =====================================================================

x-docker-hub-user: &docker-hub-user rasali

networks:
  rasali-net:
    driver: bridge

volumes:
  certbot-conf:
    driver: local
  certbot-www:
    driver: local

services:

  # ── 1. Nginx Reverse Proxy ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: rasali-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/rasali.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - rasali-net
    depends_on:
      - website
      - ralion
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 2. Marketing Website (Vite + nginx static) ─────────────
  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        VITE_API_URL: ${VITE_API_URL:-https://rasalilabs.com/api}
    image: rasali/rasali-website:latest
    container_name: rasali-website
    restart: unless-stopped
    networks:
      - rasali-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 3. Ralion Dashboard (Next.js Server Mode) ──────────────
  ralion:
    build:
      context: .
      dockerfile: Dockerfile.ralion
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rasalilabs.com/ralion}
        NEXT_PUBLIC_RASALI_PLATFORM_URL: ${NEXT_PUBLIC_RASALI_PLATFORM_URL:-https://rasalilabs.com}
    image: rasali/rasali-ralion:latest
    container_name: rasali-ralion
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side secrets (NOT exposed to browser)
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      # Social OAuth credentials
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
    networks:
      - rasali-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/ralion"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ── 4. Chatbot Backend (Express/Node.js) ───────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rasali/rasali-backend:latest
    container_name: rasali-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: "true"
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-pro}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rasalilabs.com}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    networks:
      - rasali-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 5. Certbot — SSL Certificate Renewal ───────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: rasali-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew certificates every 12 hours (certbot checks if renewal is due)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
