services:
  # 1. Chatbot & API Backend Web Service (Express/Node.js)
  - type: web
    name: alinew-chatbot-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Privileged credentials must be configured in Render, never committed.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        value: gen-lang-client-0940432200
      - key: VERTEX_AI_LOCATION
        value: us-central1
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://yidsfihagwttlmhfynmf.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CORS_ORIGINS
        value: https://rasalilabs.com

  # 2. Ralion Next.js Standalone Backend (Dynamic Social API & OAuth)
  - type: web
    name: ralion-dynamic-backend
    runtime: docker
    dockerfilePath: Dockerfile.ralion
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://yidsfihagwttlmhfynmf.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Legacy alias — must be empty or absent in Render dashboard if SUPABASE_SERVICE_ROLE_KEY is set.
      # serverAuth.ts now prefers SUPABASE_SERVICE_ROLE_KEY; a stale SUPABASE_SECRET_KEY
      # previously overrode the valid key. Keep this entry so it is visible and clearable.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://rasalilabs.com/ralion
      - key: NEXT_PUBLIC_RASALI_PLATFORM_URL
        value: https://rasalilabs.com
      - key: NEXT_STANDALONE
        value: "1"
