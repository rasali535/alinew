services:
  # 1. Chatbot & API Backend Web Service (Express/Node.js)
  - type: web
    name: alinew-chatbot-backend
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Privileged credentials must be configured in Render, never committed.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        value: gen-lang-client-0940432200
      - key: VERTEX_AI_LOCATION
        value: us-central1
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: https://yidsfihagwttlmhfynmf.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CORS_ORIGINS
        value: https://rasalilabs.com

  # 2. Ralion Next.js Standalone Backend (Dynamic Social API & OAuth)
  - type: web
    name: ralion-dynamic-backend
    runtime: docker
    dockerfilePath: Dockerfile.ralion
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://yidsfihagwttlmhfynmf.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # SUPABASE_SECRET_KEY holds the modern sb_secret_* server key and is always
      # preferred by getServiceSupabase(). Set this to the active modern secret key
      # from the Supabase dashboard (Project Settings → API → Secret key).
      - key: SUPABASE_SECRET_KEY
        sync: false
      # SUPABASE_SERVICE_ROLE_KEY is a fallback for unmigrated environments only.
      # When SUPABASE_SECRET_KEY is set to a valid sb_secret_ key, clear or delete
      # this variable so the disabled legacy JWT cannot be selected as fallback.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://rasalilabs.com/ralion
      - key: NEXT_PUBLIC_RASALI_PLATFORM_URL
        value: https://rasalilabs.com
      - key: NEXT_STANDALONE
        value: "1"
      # PayPal subscription checkout is live-only for production Ralion billing.
      # Credentials and webhook IDs remain Render-managed secrets; live plan IDs are
      # public provider identifiers and are pinned here to prevent config drift.
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_API_BASE
        value: https://api-m.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PLAN_ID_STARTER
        value: P-6PM95410S65731425NKLT7TQ
      - key: PAYPAL_PLAN_ID_PROFESSIONAL
        value: P-3MR29753W57981825NKLT7TY
      - key: PAYPAL_PLAN_ID_ENTERPRISE
        value: P-7A1329455A563464TNKLT7UA
