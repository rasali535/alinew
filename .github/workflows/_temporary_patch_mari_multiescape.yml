name: Temporary patch Mari multiescape normalization

on:
  push:
    branches:
      - fix/mari-multiescape-normalization
    paths:
      - .github/workflows/_temporary_patch_mari_multiescape.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-multiescape-normalization
          fetch-depth: 0
      - name: Patch repeated Markdown escapes
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('packages/ai/src/mariUniversalCore.ts'),
              Path('apps/ralion/src/components/MariMarkdownMessage.tsx'),
          ]
          old = r".replace(/\\([*_#\[\]()`~\\-])/g, '$1')"
          new = r".replace(/\\+([*_#\[\]()`~\\-])/g, '$1')"
          for path in files:
              src = path.read_text()
              if old not in src:
                  raise SystemExit(f'multiescape anchor not found in {path}')
              path.write_text(src.replace(old, new, 1))

          verifier = Path('scripts/verify-mari-growth-copy-hygiene.js')
          src = verifier.read_text()
          if "const core = fs.readFileSync('packages/ai/src/mariUniversalCore.ts', 'utf8');" not in src:
              src = src.replace(
                  "const component = fs.readFileSync('apps/ralion/src/components/MariMarkdownMessage.tsx', 'utf8');",
                  "const core = fs.readFileSync('packages/ai/src/mariUniversalCore.ts', 'utf8');\nconst component = fs.readFileSync('apps/ralion/src/components/MariMarkdownMessage.tsx', 'utf8');",
                  1,
              )
          anchor = "assert(component.includes('decodeMarkdownHtmlEntities'), 'Mari renderer must decode HTML entities before Markdown rendering.');"
          addition = "assert(core.includes('replace(/\\\\+(['), 'Universal Mari sanitizer must collapse repeated Markdown escape layers.');\nassert(component.includes('replace(/\\\\+(['), 'Mari renderer must collapse repeated Markdown escape layers.');\n" + anchor
          if "Universal Mari sanitizer must collapse repeated Markdown escape layers" not in src:
              if anchor not in src:
                  raise SystemExit('verifier anchor not found')
              src = src.replace(anchor, addition, 1)
          verifier.write_text(src)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/mariUniversalCore.ts apps/ralion/src/components/MariMarkdownMessage.tsx scripts/verify-mari-growth-copy-hygiene.js
          git diff --cached --check
          git commit -m "fix(mari): collapse repeated markdown escape layers"
          git push origin HEAD:fix/mari-multiescape-normalization
