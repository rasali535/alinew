name: Temporary patch Mari Growth copy hygiene

on:
  push:
    branches:
      - fix/mari-growth-copy-hygiene
    paths:
      - .github/workflows/_temporary_patch_mari_growth_copy_hygiene.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-growth-copy-hygiene
          fetch-depth: 0
      - name: Patch Mari Growth copy hygiene
        run: |
          python .github/_tmp_patch_mari_growth_copy_hygiene.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ralion/src/components/MariMarkdownMessage.tsx apps/ralion/src/app/api/social/facebook/pages/'[pageId]'/mari-growth/route.ts
          git diff --cached --check
          git commit -m "fix(mari): clean Growth copy and strengthen grounded strategy"
          git push origin HEAD:fix/mari-growth-copy-hygiene
