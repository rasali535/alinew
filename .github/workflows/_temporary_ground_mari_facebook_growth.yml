name: Temporary ground Mari Facebook growth

on:
  push:
    branches:
      - fix/mari-facebook-growth-grounding
    paths:
      - .github/workflows/_temporary_ground_mari_facebook_growth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-facebook-growth-grounding
          fetch-depth: 0
      - name: Route Facebook Growth chat through Universal Mari and remove fabricated claims
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          growth_path = Path('apps/ralion/src/app/(dashboard)/growth/page.tsx')
          growth = growth_path.read_text()
          pattern = re.compile(r"  // Helper: Chat with Mari AI\n  const handleAskMariGrowth = async \(\) => \{.*?\n  \};\n\n  // Helper: Transfer Mari Plan Recommendation", re.S)
          replacement = r'''  // Helper: Chat with Mari AI — use the universal evidence-backed Mari path.
  const handleAskMariGrowth = async () => {
    if (!mariChatQuery.trim()) return;
    const userMsg = mariChatQuery.trim();
    const conversationHistory = mariChatMessages.slice(-10).map((message) => ({
      role: message.role === 'user' ? 'user' : 'model',
      text: message.text,
    }));
    setMariChatQuery('');
    setMariChatMessages(prev => [...prev, { role: 'user', text: userMsg }]);
    setIsAskingMari(true);

    try {
      const activeFbPage = availableFacebookPages.find(p => p.isCurrentDestination || p.status === 'CONNECTED');
      const pageId = activeFbPage?.pageId || selectedPageForConnect || 'default';
      const res = await authFetch('/api/mari/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: userMsg,
          activeScreen: {
            route: '/growth',
            label: 'Facebook Growth Intelligence',
            entityId: pageId,
          },
          conversationHistory,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success || !data.answer) {
        throw new Error(data.error || `Mari request failed with status ${res.status}`);
      }
      const firstAction = Array.isArray(data.actionsSuggested) ? data.actionsSuggested[0] : null;
      setMariChatMessages(prev => [
        ...prev,
        {
          role: 'mari',
          text: data.answer,
          action: firstAction?.label,
          prompt: firstAction?.payload?.prompt || firstAction?.payload?.suggestedPrompt,
        },
      ]);
    } catch (err: any) {
      setMariChatMessages(prev => [
        ...prev,
        { role: 'mari', text: err?.message || 'Mari could not complete that evidence-backed analysis right now.' },
      ]);
    } finally {
      setIsAskingMari(false);
    }
  };

  // Helper: Transfer Mari Plan Recommendation'''
          growth2, count = pattern.subn(replacement, growth, count=1)
          if count != 1:
              raise SystemExit(f'Growth chat replacement count={count}')
          growth_path.write_text(growth2)

          route_path = Path('apps/ralion/src/app/api/social/facebook/pages/[pageId]/mari-growth/route.ts')
          route = route_path.read_text()
          old = '      postingFrequencyPerWeek: 2,\n'
          new = "      postingFrequencyPerWeek: Number((((analytics.totalPosts30d || 0) / (30 / 7))).toFixed(2)),\n"
          if old not in route:
              raise SystemExit('hard-coded postingFrequencyPerWeek marker not found')
          route_path.write_text(route.replace(old, new, 1))

          service_path = Path('apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts')
          service = service_path.read_text()

          old_engagement = '''    // 2. Engagement score (benchmark standard is 3.5% for business pages)\n    const engagement = analytics.engagementRate > 0 \n      ? Math.min(98, Math.max(20, Math.round((analytics.engagementRate / 3.5) * 65)))\n      : 20;'''
          new_engagement = '''    // 2. Engagement activity score. This is an internal heuristic, not an industry benchmark.\n    const engagement = analytics.engagementRate > 0\n      ? Math.min(98, Math.max(20, Math.round(35 + Math.min(60, analytics.engagementRate * 10))))\n      : 20;'''
          if old_engagement not in service:
              raise SystemExit('engagement benchmark block not found')
          service = service.replace(old_engagement, new_engagement, 1)
          service = service.replace("      summary = 'Publishing frequency needs acceleration to unlock broader algorithmic reach.';", "      summary = 'The current measured activity is still developing; collect more outcome data before changing cadence aggressively.';", 1)
          service = service.replace("      summary = 'Exceptional performance! High organic engagement and rapid audience growth.';", "      summary = 'Current measured activity produces a high heuristic score; validate it against sustained reach, engagement and lead outcomes before scaling.';", 1)

          start = service.index('  static async generateGrowthInsights(')
          end_marker = '  /**\n   * Generate an actionable 7-Day Facebook Growth Plan grounded in Page performance\n   */'
          end = service.index(end_marker, start)
          grounded_insights = r'''  static async generateGrowthInsights(params: {
    context: MariPageContext;
    userId: string;
  }): Promise<{ score: MariGrowthScore; insights: MariInsightItem[] }> {
    const score = this.calculateGrowthScore({
      ...params.context,
      totalLikes30d: 0,
      totalComments30d: 0,
      totalShares30d: 0,
      lastSyncedAt: new Date().toISOString(),
    });

    const hasData = params.context.totalPosts30d > 0 || params.context.totalReach30d > 0;
    const measuredCadence = Number(params.context.postingFrequencyPerWeek || 0);
    const topType = params.context.topContentType || 'text';

    const insights: MariInsightItem[] = hasData
      ? [
          {
            id: 'ins_1',
            type: 'PERFORMANCE_INSIGHT',
            title: `Measured Facebook Activity: ${params.context.totalPosts30d} Posts`,
            summary: 'This insight uses the Page metrics Ralion can currently verify. It does not infer unavailable outcomes.',
            evidence: `Observed engagement rate: ${params.context.engagementRate}%; measured reach: ${params.context.totalReach30d}; highest observed content type: ${topType}.`,
            impact: 'HIGH',
            actionLabel: 'View Analytics',
            actionType: 'VIEW_ANALYTICS',
          },
          {
            id: 'ins_2',
            type: 'GROWTH_OPPORTUNITY',
            title: 'Test Cadence Instead of Assuming an Optimum',
            summary: `The measured publishing pace is ${measuredCadence.toFixed(1)} posts/week. Change cadence only as a controlled test and compare outcomes before scaling.`,
            evidence: `Cadence is derived from ${params.context.totalPosts30d} tracked posts over the current 30-day window.`,
            impact: 'OPPORTUNITY',
            actionLabel: 'Generate Test Plan',
            actionType: 'CREATE_PLAN',
          },
          {
            id: 'ins_3',
            type: 'TIMING_INSIGHT',
            title: 'Timing Evidence Not Yet Calibrated',
            summary: 'Ralion does not currently have enough verified time-of-day outcome evidence to claim an optimal posting window for this Page.',
            evidence: 'No verified hourly/daypart performance distribution is present in the current Page context.',
            impact: 'OPPORTUNITY',
            actionLabel: 'Run Timing Test',
            actionType: 'CREATE_PLAN',
          },
        ]
      : [
          {
            id: 'ins_init',
            type: 'GROWTH_OPPORTUNITY',
            title: 'Publish and Measure Before Optimizing',
            summary: 'Mari needs real Page outcomes before making a reliable growth recommendation.',
            evidence: 'No measurable publishing or reach evidence is available in the current cycle.',
            impact: 'HIGH',
            actionLabel: 'Create First Test',
            actionType: 'CREATE_CONTENT',
            suggestedPrompt: 'Create an introductory Facebook post designed as a measurable baseline test.',
          },
        ];

    await AuditLoggerService.log({
      eventType: 'MARI_PAGE_ANALYSIS' as any,
      eventCategory: 'MARI_AI',
      userId: params.userId,
      success: true,
      resourceType: 'mari_analysis',
      resourceId: params.context.pageId,
      metadata: {
        pageName: params.context.pageName,
        growthScore: score.total,
        insightsGenerated: insights.length,
      },
    });

    return { score, insights };
  }

'''
          service = service[:start] + grounded_insights + service[end:]

          start = service.index('  static async generate7DayGrowthPlan(')
          end_marker = '  /**\n   * Process contextual user queries about Facebook Page performance\n   */'
          end = service.index(end_marker, start)
          grounded_plan = r'''  static async generate7DayGrowthPlan(params: {
    context: MariPageContext;
    userId: string;
    focusObjective?: string;
  }): Promise<MariGrowthPlanResult> {
    const brandName = (params.context.pageName && params.context.pageName !== 'No Connected Page') ? params.context.pageName : 'your business';
    const tagSlug = brandName.replace(/[^a-zA-Z0-9]/g, '');
    const observedType = params.context.topContentType || 'text';

    const days: MariGrowthPlanDay[] = [
      { dayNumber: 1, dayName: 'Monday', recommendedTime: '09:30 (test window)', contentType: 'Educational Article', topic: `Customer Problem Education for ${brandName}`, goal: 'Establish a measurable baseline for saves, comments and clicks', suggestedCaption: `What recurring business problem should we unpack next? Here is one practical perspective from ${brandName}.`, callToAction: 'Comment with the challenge you want us to cover next.', hashtags: [`#${tagSlug}`, '#BusinessGrowth'] },
      { dayNumber: 2, dayName: 'Tuesday', recommendedTime: '15:30 (test window)', contentType: observedType === 'video' ? 'Video Reel' : 'Product Feature', topic: `Capability Demonstration: ${brandName}`, goal: 'Test product-interest signals without assuming the format is proven', suggestedCaption: `A quick look at how ${brandName} approaches a real customer workflow.`, callToAction: 'Ask for a walkthrough if this workflow is relevant to your business.', hashtags: [`#${tagSlug}`, '#CustomerWorkflow'] },
      { dayNumber: 3, dayName: 'Wednesday', recommendedTime: '11:00 (test window)', contentType: 'Graphic Poster', topic: `One Clear Business Insight from ${brandName}`, goal: 'Test save/share behaviour', suggestedCaption: `One principle worth testing in your own operation this week.`, callToAction: 'Save this for your next planning session.', hashtags: [`#${tagSlug}`, '#BusinessInsight'] },
      { dayNumber: 4, dayName: 'Thursday', recommendedTime: '16:00 (test window)', contentType: 'Product Feature', topic: `Feature-to-Outcome Explanation for ${brandName}`, goal: 'Test enquiry intent', suggestedCaption: `Here is what this capability does, who it is for, and the problem it is designed to address.`, callToAction: 'Message us if you want to see whether it fits your workflow.', hashtags: [`#${tagSlug}`, '#ProductEducation'] },
      { dayNumber: 5, dayName: 'Friday', recommendedTime: '14:30 (test window)', contentType: 'Video Reel', topic: `Behind the Work at ${brandName}`, goal: 'Test human/behind-the-scenes engagement', suggestedCaption: `A short behind-the-scenes look at how we turn an idea into something useful for customers.`, callToAction: 'Tell us which part of the process you want to see next.', hashtags: [`#${tagSlug}`, '#BehindTheScenes'] },
      { dayNumber: 6, dayName: 'Saturday', recommendedTime: '10:00 (test window)', contentType: 'Graphic Poster', topic: `Weekend Question for the ${brandName} Audience`, goal: 'Test conversation depth', suggestedCaption: `What is the biggest growth or operational challenge on your desk right now?`, callToAction: 'Reply in the comments; we will use the themes to shape future content.', hashtags: [`#${tagSlug}`, '#Community'] },
      { dayNumber: 7, dayName: 'Sunday', recommendedTime: '18:00 (test window)', contentType: 'Educational Article', topic: `Week-Ahead Planning Prompt from ${brandName}`, goal: 'Test high-intent planning engagement', suggestedCaption: `Before the new week starts, choose one outcome you want to improve and one metric you will watch.`, callToAction: 'Share the metric you are focusing on this week.', hashtags: [`#${tagSlug}`, '#WeekAhead'] },
    ];

    const result: MariGrowthPlanResult = {
      title: `7-Day Growth Experiment Plan: ${brandName}`,
      pageName: brandName,
      objective: params.focusObjective || 'Collect comparable audience-response evidence',
      durationDays: 7,
      days,
      expectedImpact: 'Experimental plan only — compare reach, reactions, comments, shares and enquiry signals before treating any cadence, format or timing pattern as proven.',
      generatedAt: new Date().toISOString(),
    };

    await AuditLoggerService.log({
      eventType: 'MARI_GROWTH_RECOMMENDATION' as any,
      eventCategory: 'MARI_AI',
      userId: params.userId,
      success: true,
      resourceType: 'mari_growth_plan',
      resourceId: params.context.pageId,
      metadata: {
        pageName: params.context.pageName,
        totalPlanDays: 7,
        evidenceBoundary: 'TEST_PLAN_NOT_PREDICTED_OUTCOME',
      },
    });

    return result;
  }

'''
          service = service[:start] + grounded_plan + service[end:]

          start = service.index('  static async askMari(')
          end = service.rfind('\n  }\n}') + len('\n  }')
          grounded_ask = r'''  static async askMari(params: {
    context: MariPageContext;
    prompt: string;
    userId: string;
  }): Promise<{ answer: string; recommendedAction?: string; suggestedPrompt?: string }> {
    const p = params.prompt.toLowerCase();
    const brandName = (params.context.pageName && params.context.pageName !== 'No Connected Page') ? params.context.pageName : 'your business';
    const hasMeasuredData = params.context.totalPosts30d > 0 || params.context.totalReach30d > 0;
    const observedType = params.context.topContentType || 'text';
    const cadence = Number(params.context.postingFrequencyPerWeek || 0);

    if (!hasMeasuredData) {
      return {
        answer: `I do not yet have enough measured Facebook performance evidence for **${brandName}** to claim a winning format, cadence or posting time. Publish a small set of clearly different tests and I can compare the outcomes without inventing missing metrics.`,
        recommendedAction: 'Create Baseline Test',
        suggestedPrompt: `Create a measurable baseline Facebook post for ${brandName}.`,
      };
    }

    if (p.includes('performing') || p.includes('performance') || p.includes('health') || p.includes('status')) {
      return {
        answer: `For **${brandName}**, Ralion currently measures **${params.context.followers} followers**, **${params.context.totalPosts30d} posts in the 30-day window**, **${params.context.totalReach30d} measured reach**, and an engagement rate of **${params.context.engagementRate}%**. The highest observed content type is **${observedType}**, but this context does not prove that format caused better performance. Current measured cadence is **${cadence.toFixed(1)} posts/week**.`,
        recommendedAction: 'View Full Insights',
      };
    }

    if (p.includes('post') || p.includes('topic') || p.includes('idea') || p.includes('schedule')) {
      return {
        answer: `Use **${observedType}** as one test arm because it is the highest observed content type in the current Page data, not because it is a proven winner. Compare it against a clearly different format and CTA. I do not have verified time-of-day evidence in this Page context, so I will not claim an optimal posting time.`,
        recommendedAction: 'Open Content Composer',
        suggestedPrompt: `Create an original ${observedType} Facebook test for ${brandName} with one clear CTA and a measurable objective.`,
      };
    }

    if (p.includes('plan') || p.includes('7-day') || p.includes('growth')) {
      return {
        answer: `I can structure a 7-day **experiment plan** for **${brandName}**. The schedule and formats should be treated as hypotheses to measure, not predicted winners. Current observed cadence is **${cadence.toFixed(1)} posts/week** and the highest observed content type is **${observedType}**.`,
        recommendedAction: 'Generate 7-Day Test Plan',
      };
    }

    return {
      answer: `For **${brandName}**, I can verify ${params.context.totalPosts30d} posts in the current 30-day window, ${params.context.totalReach30d} measured reach, an engagement rate of ${params.context.engagementRate}%, and a measured cadence of ${cadence.toFixed(1)} posts/week. **${observedType}** is the highest observed content type, but I do not have evidence here for a specific share of total engagement, a universal posting frequency, or an optimal posting time. Treat the next recommendation as a controlled test and let the outcome ledger update the learning.`,
      recommendedAction: 'Create Controlled Test',
      suggestedPrompt: `Design an original Facebook content experiment for ${brandName} using our verified business context and measured Page evidence.`,
    };
  }'''
          service = service[:start] + grounded_ask + service[end:]
          service_path.write_text(service)
          PY
      - name: Verify forbidden hard-coded Facebook growth claims are removed
        run: |
          ! grep -q "62% of your total engagement" apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          ! grep -q "benchmark standard is 3.5%" apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          ! grep -q "Maintaining 3 to 4 posts weekly" apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          ! grep -q "peaks at 15:30 CAT" apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          ! grep -q "+18% Organic Reach" apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          grep -q "authFetch('/api/mari/chat'" "apps/ralion/src/app/(dashboard)/growth/page.tsx"
      - name: Commit grounding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ralion/src/app/(dashboard)/growth/page.tsx apps/ralion/src/app/api/social/facebook/pages/[pageId]/mari-growth/route.ts apps/ralion/src/lib/services/social/mariFacebookGrowth.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(mari): ground Facebook growth answers in verified evidence"
          git push origin HEAD:fix/mari-facebook-growth-grounding
