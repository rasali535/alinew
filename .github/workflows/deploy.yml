name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:   # also allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. SSH into Hostinger VPS & deploy ───────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 25m
          script: |
            set -e

            echo "📦 Navigating to project directory..."
            cd /var/www/rasalilabs

            echo "⬇️  Pulling latest code from main..."
            git pull origin main

            echo "🔑 Ensuring .env is in place..."
            # .env should already exist on the VPS (you put it there once manually)
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env file not found on VPS! Please create it from .env.production.example"
              exit 1
            fi

            echo "🐳 Building and restarting Docker containers..."
            docker compose pull --ignore-buildable 2>/dev/null || true
            docker compose up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "🔍 Checking container health..."
            sleep 10
            docker compose ps

            echo "✅ Deployment complete!"

      # ── 3. Notify on success ──────────────────────────────────
      - name: Deployment Success Notification
        if: success()
        run: |
          echo "🚀 Rasali Labs deployed successfully to Hostinger VPS!"
          echo "🌐 https://rasalilabs.com"

      # ── 4. Notify on failure ──────────────────────────────────
      - name: Deployment Failed Notification
        if: failure()
        run: |
          echo "❌ Deployment FAILED — check logs above"
