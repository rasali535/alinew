name: Mari production hardening one-shot

on:
  push:
    branches:
      - fix/mari-production-hardening

permissions:
  contents: write

jobs:
  harden-mari:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical Mari production fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_required(text: str, old: str, new: str, label: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} match(es), found {count}: {old[:100]!r}")
              return text.replace(old, new, expected)

          # 1) Mari model policy: classifier uses Flash-Lite; answers use Flash; max two attempts per stage.
          core_path = Path('packages/ai/src/mariUniversalCore.ts')
          core = core_path.read_text()
          legacy_chain = re.compile(
              r"  const modelsToTry = \[\n"
              r"\s*'gemini-3\.5-flash-lite',\n"
              r"\s*'gemini-3\.6-flash',\n"
              r"\s*'gemini-3\.5-flash',\n"
              r"\s*'gemini-3\.1-pro-preview',\n"
              r"\s*\];"
          )
          if len(legacy_chain.findall(core)) != 2:
              raise SystemExit(f"mariUniversalCore.ts: expected 2 legacy model chains, found {len(legacy_chain.findall(core))}")
          classifier_chain = "  const modelsToTry = [\n    'gemini-2.5-flash-lite',\n    'gemini-3.5-flash',\n  ];"
          response_chain = "  const modelsToTry = [\n    'gemini-3.5-flash',\n    'gemini-2.5-flash-lite',\n  ];"
          core = legacy_chain.sub(classifier_chain, core, count=1)
          core = legacy_chain.sub(response_chain, core, count=1)
          core = replace_required(core, "classificationModelAttempted = 'gemini-3.5-flash-lite';", "classificationModelAttempted = 'gemini-2.5-flash-lite';", 'classifier default')
          core = replace_required(core, "modelClassification.modelsAttempted[0] || 'gemini-3.5-flash-lite'", "modelClassification.modelsAttempted[0] || 'gemini-2.5-flash-lite'", 'classifier attempt fallback')
          core = replace_required(core, "model: 'gemini-3.5-flash-lite',", "model: 'gemini-3.5-flash',", 'response missing-key model')
          core = replace_required(core, "model: modelsAttempted[0] || 'gemini-3.5-flash-lite',", "model: modelsAttempted[0] || 'gemini-3.5-flash',", 'response failed model')
          core = replace_required(core, "responseModelAttempted = 'gemini-3.5-flash-lite';\n    modelAttempted = 'gemini-3.5-flash-lite';", "responseModelAttempted = 'gemini-3.5-flash';\n    modelAttempted = 'gemini-3.5-flash';", 'response defaults')
          core = replace_required(core, "geminiResult.modelsAttempted[0] || 'gemini-3.5-flash-lite'", "geminiResult.modelsAttempted[0] || 'gemini-3.5-flash'", 'response attempted model', expected=2)
          core = replace_required(core, "modelErrors[modelName] = `EXCEPTION_${err?.message || 'NETWORK_ERROR'}`;", "modelErrors[modelName] = 'PROVIDER_EXCEPTION';", 'classifier provider error')
          core = replace_required(core, "lastError = `EXCEPTION_${err.message}`;\n      modelErrors[modelName] = `EXCEPTION_${err.message}`;", "lastError = 'PROVIDER_EXCEPTION';\n      modelErrors[modelName] = 'PROVIDER_EXCEPTION';", 'response provider error')
          core = replace_required(core, "const record = MariTokenTelemetryService.recordUsage({", "const record = await MariTokenTelemetryService.recordUsage({", 'await durable telemetry')
          if any(x in core for x in ('gemini-3.6-flash', 'gemini-3.1-pro-preview', 'gemini-3.5-flash-lite')):
              raise SystemExit('mariUniversalCore.ts: obsolete Gemini identifier remains')
          core_path.write_text(core)

          # 2) Legacy shared LLM helper must honor requested model and default to the answer model.
          aiml_path = Path('packages/ai/src/aimlClient.ts')
          aiml = aiml_path.read_text()
          aiml = replace_required(
              aiml,
              "  const {\n    maxTokens = 1024,\n    temperature = 0.7,\n  } = options;",
              "  const {\n    model = 'gemini-3.5-flash',\n    maxTokens = 1024,\n    temperature = 0.7,\n  } = options;",
              'aiml model default'
          )
          aiml = replace_required(
              aiml,
              "`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`",
              "`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`",
              'aiml hardcoded model'
          )
          aiml_path.write_text(aiml)

          # 3) Usage route: require authenticated server tenant context; never trust query/header tenant IDs directly.
          usage_route = """import { NextRequest } from 'next/server';
          import { corsJsonResponse, handleCorsPreflight } from '../../../../lib/cors';
          import { getCurrentRalionContext, authRequiredResponse } from '@/lib/auth/serverAuth';
          import { MariTokenTelemetryService } from '@ralion/ai/server';

          export const dynamic = 'force-dynamic';

          export async function OPTIONS(request: NextRequest) {
            return handleCorsPreflight(request);
          }

          /**
           * GET /api/mari/usage
           * Authoritative authenticated tenant-scoped Mari AI usage stats.
           */
          export async function GET(request: NextRequest) {
            try {
              const serverCtx = await getCurrentRalionContext(request, { requireAuth: true });
              if (!serverCtx) {
                return authRequiredResponse(request, 'Authentication required to view Mari usage.');
              }

              const orgId =
                serverCtx.organization?.id ||
                serverCtx.workspace.organization_id ||
                serverCtx.workspace.id;

              const telemetry = await MariTokenTelemetryService.getAuthoritativeUsage(orgId);

              return corsJsonResponse({
                success: true,
                data: {
                  organizationId: orgId,
                  queryCount: telemetry.requestCount,
                  totalPromptTokens: telemetry.totalPromptTokens,
                  totalCompletionTokens: telemetry.totalCompletionTokens,
                  totalTokens: telemetry.totalTokens,
                  timestamp: new Date().toISOString(),
                },
              }, undefined, request);
            } catch (err: any) {
              console.error('[Mari Usage API] Failed to retrieve usage:', err?.message || err);
              return corsJsonResponse({
                success: false,
                code: 'MARI_USAGE_UNAVAILABLE',
                error: 'Mari usage is temporarily unavailable. Please retry.',
              }, { status: 500 }, request);
            }
          }
          """
          Path('apps/ralion/src/app/api/mari/usage/route.ts').write_text(textwrap.dedent(usage_route))

          # 4) Telemetry: await durable audit persistence, and rebuild totals from durable tenant-scoped rows after cold starts.
          telemetry_path = Path('packages/ai/src/tokenTelemetry.service.ts')
          telemetry = telemetry_path.read_text()
          telemetry = replace_required(
              telemetry,
              "  static recordUsage(params: {",
              "  static async recordUsage(params: {",
              'async recordUsage'
          )
          telemetry = replace_required(
              telemetry,
              "  }): TokenUsageRecord {",
              "  }): Promise<TokenUsageRecord> {",
              'async recordUsage return'
          )
          persist_start = telemetry.index('    // Durable persistence to security audit log')
          persist_end = telemetry.index('\n\n    return record;', persist_start)
          durable_block = """    // Durable persistence is awaited so serverless teardown cannot drop a usage event.
              if (typeof window === 'undefined' && typeof process !== 'undefined' && process.env) {
                const env = process.env;
                const supabaseUrl = env.NEXT_PUBLIC_SUPABASE_URL || env.SUPABASE_URL;
                const serviceKey = env['SUPABASE_SECRET_KEY'] || env['SUPABASE_SERVICE_ROLE_KEY'] || env['SUPABASE_SERVICE_KEY'];

                if (supabaseUrl && serviceKey) {
                  try {
                    const { createClient } = await import('@supabase/supabase-js');
                    const client = createClient(supabaseUrl, serviceKey, {
                      auth: { persistSession: false, autoRefreshToken: false },
                    });
                    const { error } = await client.from('security_audit_logs').insert({
                      event_type: 'MARI_PAGE_ANALYSIS',
                      event_category: 'MARI_AI',
                      success: true,
                      user_id: userId || null,
                      actor_user_id: userId || null,
                      resource_type: 'TENANT_WORKSPACE',
                      resource_id: organizationId,
                      metadata: {
                        requestId,
                        provider,
                        model,
                        inputTokens,
                        outputTokens,
                        totalTokens,
                        action: 'MARI_AI_QUERY',
                      },
                      timestamp: record.timestamp,
                      created_at: record.timestamp,
                    });
                    if (error) {
                      console.warn('[MariTokenTelemetry] Durable usage insert failed:', error.code || 'DB_ERROR');
                    }
                  } catch {
                    console.warn('[MariTokenTelemetry] Durable usage insert failed: PROVIDER_ERROR');
                  }
                }
              }"""
          telemetry = telemetry[:persist_start] + textwrap.dedent(durable_block).replace('\n', '\n    ').lstrip() + telemetry[persist_end:]

          method_start = telemetry.index('  /**\n   * Authoritative count of Mari interactions for an organization.')
          method_end = telemetry.index('  /**\n   * Resets records for testing purposes.', method_start)
          durable_getter = """  /**
           * Gets durable, tenant-scoped Mari usage and merges any in-memory events
           * that have not reached the audit log yet. This survives serverless cold starts.
           */
          static async getAuthoritativeUsage(organizationId: string): Promise<{
            totalPromptTokens: number;
            totalCompletionTokens: number;
            totalTokens: number;
            requestCount: number;
          }> {
            const merged = new Map<string, { inputTokens: number; outputTokens: number; totalTokens: number }>();

            for (const record of this.records.get(organizationId) || []) {
              merged.set(record.requestId, {
                inputTokens: record.inputTokens,
                outputTokens: record.outputTokens,
                totalTokens: record.totalTokens,
              });
            }

            const supabaseUrl = process.env.SUPABASE_URL || process.env.NEXT_PUBLIC_SUPABASE_URL;
            const serviceKey = process.env.SUPABASE_SECRET_KEY || process.env.SUPABASE_SERVICE_ROLE_KEY || process.env.SUPABASE_SERVICE_KEY;

            if (supabaseUrl && serviceKey) {
              try {
                const { createClient } = await import('@supabase/supabase-js');
                const client = createClient(supabaseUrl, serviceKey, {
                  auth: { persistSession: false, autoRefreshToken: false },
                });

                const pageSize = 1000;
                let from = 0;
                while (true) {
                  const { data, error } = await client
                    .from('security_audit_logs')
                    .select('id, metadata')
                    .eq('event_category', 'MARI_AI')
                    .eq('resource_id', organizationId)
                    .range(from, from + pageSize - 1);

                  if (error) break;
                  const rows = data || [];
                  for (const row of rows) {
                    const metadata = (row as any)?.metadata || {};
                    const requestId = String(metadata.requestId || (row as any)?.id || '');
                    if (!requestId) continue;
                    const inputTokens = Number(metadata.inputTokens || 0);
                    const outputTokens = Number(metadata.outputTokens || 0);
                    const totalTokens = Number(metadata.totalTokens ?? (inputTokens + outputTokens));
                    merged.set(requestId, {
                      inputTokens: Number.isFinite(inputTokens) ? inputTokens : 0,
                      outputTokens: Number.isFinite(outputTokens) ? outputTokens : 0,
                      totalTokens: Number.isFinite(totalTokens) ? totalTokens : 0,
                    });
                  }

                  if (rows.length < pageSize) break;
                  from += pageSize;
                }
              } catch {}
            }

            let totalPromptTokens = 0;
            let totalCompletionTokens = 0;
            let totalTokens = 0;
            for (const usage of merged.values()) {
              totalPromptTokens += usage.inputTokens;
              totalCompletionTokens += usage.outputTokens;
              totalTokens += usage.totalTokens;
            }

            return {
              totalPromptTokens,
              totalCompletionTokens,
              totalTokens,
              requestCount: merged.size,
            };
          }

          /**
           * Authoritative count of Mari interactions for an organization.
           */
          static async getAuthoritativeUsageCount(organizationId: string): Promise<number> {
            const usage = await this.getAuthoritativeUsage(organizationId);
            return usage.requestCount;
          }

          """
          telemetry = telemetry[:method_start] + textwrap.dedent(durable_getter) + telemetry[method_end:]
          telemetry_path.write_text(telemetry)

          # 5) Chat route: retain internal logs, return only stable public error code/message.
          chat_path = Path('apps/ralion/src/app/api/mari/chat/route.ts')
          chat = chat_path.read_text()
          chat = replace_required(
              chat,
              "      success: false,\n      error: err.message || \"Mari couldn't complete that request right now. Please retry.\",",
              "      success: false,\n      code: 'MARI_REQUEST_FAILED',\n      error: \"Mari couldn't complete that request right now. Please retry.\",",
              'chat public provider error'
          )
          chat_path.write_text(chat)

          # 6) Main Mari screen: send real workspace and never turn server failure into a fake successful reply.
          page_path = Path('apps/ralion/src/app/(dashboard)/mari-ai/page.tsx')
          page = page_path.read_text()
          page = replace_required(page, "'x-workspace-id': effectiveOrgId,", "'x-workspace-id': activeWorkspaceId || effectiveOrgId,", 'main workspace header')
          page = replace_required(page, "organizationId: effectiveOrgId,\n            userId:", "organizationId: effectiveOrgId,\n            workspaceId: activeWorkspaceId || undefined,\n            userId:", 'main workspace body')
          page = replace_required(page, "data.modelUsed || 'Mari Enterprise Intelligence (gemini-2.5-flash)'", "data.modelUsed || 'Mari Enterprise Intelligence (gemini-3.5-flash)'", 'main model label')
          page = replace_required(page, "responseSource = 'CLIENT_FALLBACK';", "responseSource = 'SERVER_ERROR';", 'main fake fallback source')
          page = replace_required(page, "fallbackReason = 'NETWORK_OR_SERVER_UNREACHABLE';", "fallbackReason = httpStatus ? `HTTP_${httpStatus}` : 'NETWORK_OR_SERVER_UNREACHABLE';", 'main fallback reason')
          page = replace_required(page, "answerText = \"I am ready to assist with your growth strategy, campaign planning, and business analysis. How can I help you today?\";", "throw new Error('Mari server response unavailable');", 'main fake answer')
          page = replace_required(page, "text: answerText || \"I've reviewed your business context and am ready to assist with growth strategy and campaign execution.\",", "text: answerText,", 'main final fake answer')
          page = replace_required(page, "text: `Mari couldn't complete that request right now. Please retry. (${err.message || 'Connection error'})`,", "text: `Mari couldn't complete that request right now. Please retry.`,", 'main raw client error')
          page_path.write_text(page)

          # 7) Floating Mari: authoritative org/workspace hints and fail-closed UI errors.
          floating_path = Path('apps/ralion/src/components/FloatingMariAi.tsx')
          floating = floating_path.read_text()
          floating = replace_required(floating, "const { organization, user } = useOrganization();", "const { organization, workspace, user } = useOrganization();", 'floating workspace context')
          floating = replace_required(floating, "let activeOrgId: string = organization?.id || (user as any)?.id || (user as any)?.userId || '';", "let activeOrgId: string = organization?.id || '';", 'floating org fallback')
          floating = replace_required(floating, "'x-workspace-id': activeOrgId,", "'x-workspace-id': workspace?.id || activeOrgId,", 'floating workspace header')
          floating = replace_required(floating, "organizationId: activeOrgId,\n          messages:", "organizationId: activeOrgId,\n          workspaceId: workspace?.id || undefined,\n          messages:", 'floating workspace body')
          floating = replace_required(floating, "responseText = data.answer || data.text || \"I'm analyzing your business data right now.\";", "responseText = data.answer || data.text || '';\n        if (!data.success || !responseText) throw new Error('Invalid Mari server response');", 'floating fake success')
          floating = replace_required(floating, "responseText = \"I am currently synchronizing with your live business data. You can access Growth Studio, CRM, and Campaign tools directly from your workspace.\";\n        responseSource = 'HTTP_NON_200_FALLBACK';", "responseText = \"Mari couldn't complete that request right now. Please retry.\";\n        responseSource = 'HTTP_ERROR';", 'floating http fallback')
          floating = replace_required(floating, "fallbackReason = `NETWORK_ERROR_${err.message || 'EXCEPTION'}`;\n      responseText = \"I'm having trouble connecting to my neural reasoning core right now. Please check your network connection.\";\n      responseSource = 'NETWORK_ERROR_FALLBACK';", "fallbackReason = 'NETWORK_ERROR';\n      responseText = \"Mari couldn't reach the server right now. Please retry.\";\n      responseSource = 'NETWORK_ERROR';", 'floating network fallback')
          floating_path.write_text(floating)

          # 8) Drawer Mari: same fail-closed behavior and canonical workspace hinting.
          drawer_path = Path('apps/ralion/src/components/MariAiDrawer.tsx')
          drawer = drawer_path.read_text()
          drawer = replace_required(drawer, "const { organization, user } = useOrganization();", "const { organization, workspace, user } = useOrganization();", 'drawer workspace context')
          drawer = replace_required(drawer, "let activeOrgId: string = organization?.id || (user as any)?.id || (user as any)?.userId || '';", "let activeOrgId: string = organization?.id || '';", 'drawer org fallback')
          drawer = replace_required(drawer, "'x-workspace-id': activeOrgId,", "'x-workspace-id': workspace?.id || activeOrgId,", 'drawer workspace header')
          drawer = replace_required(drawer, "organizationId: activeOrgId,\n            activeScreen:", "organizationId: activeOrgId,\n            workspaceId: workspace?.id || undefined,\n            activeScreen:", 'drawer workspace body')
          drawer = replace_required(drawer, "respText = data.answer || data.text || \"I've reviewed your business intelligence.\";", "respText = data.answer || data.text || '';\n          if (!data.success || !respText) throw new Error('Invalid Mari server response');", 'drawer fake success')
          drawer = replace_required(drawer, "respText = \"I am ready to assist with your growth strategy, campaign planning, and business analysis.\";\n          responseSource = 'HTTP_NON_200_FALLBACK';", "respText = \"Mari couldn't complete that request right now. Please retry.\";\n          responseSource = 'HTTP_ERROR';", 'drawer http fallback')
          drawer = replace_required(drawer, "fallbackReason = `NETWORK_ERROR_${err.message || 'EXCEPTION'}`;\n        respText = \"I'm having trouble connecting to my neural reasoning core right now. Please check your network connection.\";\n        responseSource = 'NETWORK_ERROR_FALLBACK';", "fallbackReason = 'NETWORK_ERROR';\n        respText = \"Mari couldn't reach the server right now. Please retry.\";\n        responseSource = 'NETWORK_ERROR';", 'drawer network fallback')
          drawer_path.write_text(drawer)

          # Focused source invariants before compiler checks.
          checks = {
              str(core_path): ["'gemini-2.5-flash-lite'", "'gemini-3.5-flash'", "lastError = 'PROVIDER_EXCEPTION'", 'await MariTokenTelemetryService.recordUsage'],
              'apps/ralion/src/app/api/mari/usage/route.ts': ['requireAuth: true', 'getAuthoritativeUsage(orgId)'],
              str(telemetry_path): ['static async recordUsage(', 'static async getAuthoritativeUsage(', ".eq('resource_id', organizationId)"],
              str(page_path): ["responseSource = 'SERVER_ERROR'", 'workspaceId: activeWorkspaceId || undefined'],
              str(floating_path): ["responseSource = 'HTTP_ERROR'", 'workspaceId: workspace?.id || undefined'],
              str(drawer_path): ["responseSource = 'HTTP_ERROR'", 'workspaceId: workspace?.id || undefined'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing invariant {needle!r}")

          forbidden = {
              str(core_path): ['gemini-3.6-flash', 'gemini-3.1-pro-preview', 'gemini-3.5-flash-lite'],
              str(page_path): ["responseSource = 'CLIENT_FALLBACK'", 'How can I help you today?";'],
              str(floating_path): ['HTTP_NON_200_FALLBACK', 'NETWORK_ERROR_FALLBACK'],
              str(drawer_path): ['HTTP_NON_200_FALLBACK', 'NETWORK_ERROR_FALLBACK'],
          }
          for path, needles in forbidden.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"{path}: forbidden legacy behavior remains: {needle!r}")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check Mari AI package
        run: npx tsc -p packages/ai/tsconfig.json --noEmit

      - name: Type-check Ralion app
        run: npx tsc -p apps/ralion/tsconfig.json --noEmit

      - name: Commit tested hardening and remove one-shot runner
        shell: bash
        run: |
          rm -f .github/workflows/mari-production-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/mariUniversalCore.ts packages/ai/src/aimlClient.ts packages/ai/src/tokenTelemetry.service.ts \
            apps/ralion/src/app/api/mari/chat/route.ts apps/ralion/src/app/api/mari/usage/route.ts \
            'apps/ralion/src/app/(dashboard)/mari-ai/page.tsx' apps/ralion/src/components/FloatingMariAi.tsx \
            apps/ralion/src/components/MariAiDrawer.tsx .github/workflows/mari-production-hardening-once.yml
          git commit -m "fix(mari): harden models tenant usage and client failures"
          git push origin HEAD:fix/mari-production-hardening
