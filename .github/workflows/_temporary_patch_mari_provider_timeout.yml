name: Temporary patch Mari provider timeout

on:
  push:
    branches:
      - fix/mari-provider-timeout
    paths:
      - .github/workflows/_temporary_patch_mari_provider_timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-provider-timeout
          fetch-depth: 0
      - name: Patch Mari provider timeout handling
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('packages/ai/src/mariUniversalCore.ts')
          src = core.read_text()
          anchor = "const MARI_RESPONSE_MODEL = process.env.MARI_GEMINI_MODEL || process.env.GEMINI_MODEL || 'gemini-3.5-flash';"
          insert = anchor + "\nconst MARI_CLASSIFIER_PROVIDER_BUDGET_MS = Math.max(1000, Number(process.env.MARI_CLASSIFIER_PROVIDER_BUDGET_MS || 2500));\nconst MARI_RESPONSE_PROVIDER_BUDGET_MS = Math.max(2500, Number(process.env.MARI_RESPONSE_PROVIDER_BUDGET_MS || 7000));"
          if anchor not in src:
              raise SystemExit('model constant anchor not found')
          src = src.replace(anchor, insert, 1)

          classifier_anchor = "  const modelsToTry = modelsWithStableFallback(MARI_CLASSIFIER_MODEL);\n\n  for (const modelName of modelsToTry) {"
          classifier_new = "  const modelsToTry = modelsWithStableFallback(MARI_CLASSIFIER_MODEL);\n  const providerDeadlineAt = Date.now() + MARI_CLASSIFIER_PROVIDER_BUDGET_MS;\n\n  for (const modelName of modelsToTry) {\n    const remainingProviderMs = providerDeadlineAt - Date.now();\n    if (remainingProviderMs <= 0) {\n      modelErrors[modelName] = 'PROVIDER_TIMEOUT';\n      break;\n    }"
          if classifier_anchor not in src:
              raise SystemExit('classifier loop anchor not found')
          src = src.replace(classifier_anchor, classifier_new, 1)

          first_body = "        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig: {\n            temperature: 0.1,\n            maxOutputTokens: 800,\n            responseMimeType: 'application/json',\n          },\n        }),\n      });"
          first_body_new = "        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig: {\n            temperature: 0.1,\n            maxOutputTokens: 800,\n            responseMimeType: 'application/json',\n          },\n        }),\n        signal: AbortSignal.timeout(remainingProviderMs),\n      });"
          if first_body not in src:
              raise SystemExit('classifier fetch anchor not found')
          src = src.replace(first_body, first_body_new, 1)

          classifier_catch = "    } catch (err: any) {\n      modelErrors[modelName] = 'PROVIDER_EXCEPTION';\n      continue;\n    }"
          classifier_catch_new = "    } catch (err: any) {\n      const isTimeout = err?.name === 'TimeoutError' || err?.name === 'AbortError';\n      modelErrors[modelName] = isTimeout ? 'PROVIDER_TIMEOUT' : 'PROVIDER_EXCEPTION';\n      continue;\n    }"
          if classifier_catch not in src:
              raise SystemExit('classifier catch anchor not found')
          src = src.replace(classifier_catch, classifier_catch_new, 1)

          neural_anchor = "  const modelsToTry = modelsWithStableFallback(MARI_RESPONSE_MODEL);\n  let lastError = '';\n\n  for (const modelName of modelsToTry) {"
          neural_new = "  const modelsToTry = modelsWithStableFallback(MARI_RESPONSE_MODEL);\n  let lastError = '';\n  const providerDeadlineAt = Date.now() + MARI_RESPONSE_PROVIDER_BUDGET_MS;\n\n  for (const modelName of modelsToTry) {\n    const remainingProviderMs = providerDeadlineAt - Date.now();\n    if (remainingProviderMs <= 0) {\n      lastError = 'PROVIDER_TIMEOUT';\n      modelErrors[modelName] = 'PROVIDER_TIMEOUT';\n      break;\n    }"
          if neural_anchor not in src:
              raise SystemExit('neural loop anchor not found')
          src = src.replace(neural_anchor, neural_new, 1)

          neural_body = "        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig: {\n            temperature: 0.4,\n            maxOutputTokens: 1500,\n          },\n        }),\n      });"
          neural_body_new = "        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig: {\n            temperature: 0.4,\n            maxOutputTokens: 1500,\n          },\n        }),\n        signal: AbortSignal.timeout(remainingProviderMs),\n      });"
          if neural_body not in src:
              raise SystemExit('neural fetch anchor not found')
          src = src.replace(neural_body, neural_body_new, 1)

          neural_catch = "    } catch (err: any) {\n      lastError = 'PROVIDER_EXCEPTION';\n      modelErrors[modelName] = 'PROVIDER_EXCEPTION';\n      console.warn(`[MariCore] Gemini (${modelName}) request exception`);\n    }"
          neural_catch_new = "    } catch (err: any) {\n      const isTimeout = err?.name === 'TimeoutError' || err?.name === 'AbortError';\n      lastError = isTimeout ? 'PROVIDER_TIMEOUT' : 'PROVIDER_EXCEPTION';\n      modelErrors[modelName] = lastError;\n      console.warn(`[MariCore] Gemini (${modelName}) request ${isTimeout ? 'timed out' : 'exception'}`);\n    }"
          if neural_catch not in src:
              raise SystemExit('neural catch anchor not found')
          src = src.replace(neural_catch, neural_catch_new, 1)
          core.write_text(src)

          growth = Path('apps/ralion/src/app/(dashboard)/growth/page.tsx')
          src = growth.read_text()
          ok_block = "      if (res.ok) {\n        const data = await res.json().catch(() => ({}));\n        if (data.chat) {\n          setMariChatMessages(prev => [\n            ...prev,\n            { role: 'mari', text: normalizeMarkdownText(String(data.chat.answer || '')), action: data.chat.recommendedAction, prompt: data.chat.suggestedPrompt },\n          ]);\n        }\n      }"
          ok_new = ok_block + " else {\n        const errorPayload = await res.json().catch(() => ({}));\n        console.warn('[Growth] Mari request failed', { status: res.status, error: errorPayload?.error });\n        setMariChatMessages(prev => [\n          ...prev,\n          { role: 'mari', text: res.status === 502\n            ? 'Mari’s live reasoning provider took too long to respond. Your business data is safe — please retry the request.'\n            : `Mari could not complete this request (HTTP ${res.status}). Please retry.` },\n        ]);\n      }"
          if ok_block not in src:
              raise SystemExit('growth response block anchor not found')
          src = src.replace(ok_block, ok_new, 1)
          growth.write_text(src)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/mariUniversalCore.ts apps/ralion/src/app/'(dashboard)'/growth/page.tsx
          git diff --cached --check
          git commit -m "fix(mari): bound provider latency and surface Growth failures"
          git push origin HEAD:fix/mari-provider-timeout
