name: Temporary remove legacy market intel

on:
  push:
    branches:
      - fix/competitive-intelligence-dashboard
    paths:
      - .github/workflows/_temporary_remove_legacy_market_intel.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competitive-intelligence-dashboard
          fetch-depth: 0
      - name: Remove hidden legacy market intelligence JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/ralion/src/app/(dashboard)/growth/page.tsx')
          s = p.read_text()
          start = "\n            {false && pageWorkspaceTab === 'MARKET_INTEL' && (\n"
          end = "\n            )}\n          </div>\n        )}\n        </div>\n      )}\n"
          if start not in s:
              raise SystemExit('legacy MARKET_INTEL start marker not found')
          before, rest = s.split(start, 1)
          if end not in rest:
              raise SystemExit('legacy MARKET_INTEL end marker not found')
          _, after = rest.split(end, 1)
          replacement = "\n          </div>\n        )}\n        </div>\n      )}\n"
          p.write_text(before + replacement + after)
          PY
      - name: Verify cleanup
        run: |
          grep -q "pageWorkspaceTab === 'MARKET_INTEL' && <CompetitiveIntelligencePanel />" "apps/ralion/src/app/(dashboard)/growth/page.tsx"
          ! grep -q "false && pageWorkspaceTab === 'MARKET_INTEL'" "apps/ralion/src/app/(dashboard)/growth/page.tsx"
          ! grep -q "Avg: +.*4.5" "apps/ralion/src/app/(dashboard)/growth/page.tsx"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/ralion/src/app/(dashboard)/growth/page.tsx"
          git diff --cached --quiet && exit 0
          git commit -m "refactor(growth): remove legacy market research placeholder"
          git push origin HEAD:fix/competitive-intelligence-dashboard
