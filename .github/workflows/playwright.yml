name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Require production E2E target
      env:
        RALION_E2E_BASE_URL: ${{ secrets.RALION_E2E_BASE_URL }}
      run: |
        if [ -z "$RALION_E2E_BASE_URL" ]; then
          echo "::error::RALION_E2E_BASE_URL repository secret is required for production smoke tests."
          exit 1
        fi
    - name: Run Ralion Playwright tests
      env:
        RALION_E2E_BASE_URL: ${{ secrets.RALION_E2E_BASE_URL }}
      run: npx playwright test tests/production-security.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
