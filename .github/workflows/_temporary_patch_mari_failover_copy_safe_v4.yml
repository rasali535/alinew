name: Temporary correct Mari fallback copy-safe boundary

on:
  push:
    branches:
      - fix/mari-provider-failover-copy-safe
    paths:
      - .github/workflows/_temporary_patch_mari_failover_copy_safe_v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-provider-failover-copy-safe
          fetch-depth: 0
      - name: Move copy-safe normalization to final fallback boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('apps/ralion/src/app/api/social/facebook/pages/[pageId]/mari-growth/route.ts')
          route = route_path.read_text()
          helper_start = route.index('function buildGroundedGrowthStrategyFallback')
          helper_end = route.index('export async function OPTIONS', helper_start)
          helper = route[helper_start:helper_end]

          wrong = "].join('\\n').replace(/\\*\\*/g, '');\n\n  return ["
          fixed = "].join('\\n');\n\n  return ["
          if wrong not in helper:
              raise SystemExit('content idea copy-safe misplacement anchor not found')
          helper = helper.replace(wrong, fixed, 1)

          final_anchor = "].join('\\n');\n}\n\n"
          final_replacement = "].join('\\n').replace(/\\*\\*/g, '');\n}\n\n"
          if final_anchor not in helper:
              raise SystemExit('final fallback join anchor not found')
          helper = helper.replace(final_anchor, final_replacement, 1)
          route = route[:helper_start] + helper + route[helper_end:]
          route_path.write_text(route)

          test_path = Path('scripts/verify-mari-growth-copy-hygiene.js')
          test = test_path.read_text()
          old = "assert(route.includes(\"].join('\\\\n').replace(/\\\\*\\\\*/g, '')\"), 'Grounded Growth fallback must remove inline bold markers for copy-safe output.');"
          new = "assert(helper.trim().endsWith(\"].join('\\\\n').replace(/\\\\*\\\\*/g, '');\\n}\"), 'Grounded Growth fallback must remove inline bold markers at the final return boundary.');"
          if old not in test:
              raise SystemExit('copy verifier old assertion not found')
          test = test.replace(old, new, 1)
          test_path.write_text(test)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/ralion/src/app/api/social/facebook/pages/[pageId]/mari-growth/route.ts' scripts/verify-mari-growth-copy-hygiene.js
          git diff --cached --check
          git commit -m "fix(mari): make grounded fallback copy-safe at boundary"
          git push origin HEAD:fix/mari-provider-failover-copy-safe
