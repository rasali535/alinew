# This workflow performs deterministic installation, security checks, build and tests.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Scan tracked source for privileged credentials
      run: npm run security:secrets
    - name: Verify Facebook tenant isolation invariants
      run: npm run security:facebook-isolation
    - name: Build all workspaces
      run: npm run build --if-present
    - name: Run test suite
      run: npm test
