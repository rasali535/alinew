# This workflow performs deterministic installation, security checks, build and tests.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Scan tracked source for privileged credentials
      run: npm run security:secrets
    - name: Verify Facebook tenant isolation invariants
      run: npm run security:facebook-isolation
    - name: Verify social database RLS invariants
      run: npm run security:social-rls
    - name: Run repository security audit
      run: npm run security:audit
    - name: Verify database function permissions and tenant isolation
      run: node scripts/security/test-public-function-hardening.mjs
    - name: Replay all Supabase migrations into a clean PostgreSQL database
      run: node scripts/security/test-preview-migration-replay.mjs
    - name: Verify social health tenant isolation
      run: node scripts/security/test-social-health-tenant-isolation.cjs
    - name: Verify Mari action completion claims
      run: node scripts/security/test-mari-action-results.cjs
    - name: Run production readiness smoke
      run: npm run test:e2e
    - name: Build all workspaces
      run: npm run build --if-present
    - name: Run test suite
      run: npm test
