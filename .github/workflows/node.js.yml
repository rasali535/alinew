# This workflow performs deterministic installation, security checks, build and tests.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Apply one-time Growth creative fidelity migration
      if: github.event_name == 'pull_request' && github.head_ref == 'fix/creative-prompt-fidelity'
      env:
        HEAD_BRANCH: ${{ github.head_ref }}
      run: |
        git fetch origin "$HEAD_BRANCH"
        git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
        node scripts/patch-growth-creative-fidelity.js
        if ! git diff --quiet -- apps/ralion/src/app/'(dashboard)'/growth/page.tsx packages/ai/src/aimlClient.ts; then
          git config user.name "Ras Ali Labs CI"
          git config user.email "ali@rasalilabs.com"
          git add apps/ralion/src/app/'(dashboard)'/growth/page.tsx packages/ai/src/aimlClient.ts
          git commit -m "fix(growth): remove synthetic creative success fallbacks"
          git push origin "HEAD:$HEAD_BRANCH"
        fi
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Scan tracked source for privileged credentials
      run: npm run security:secrets
    - name: Verify Facebook tenant isolation invariants
      run: npm run security:facebook-isolation
    - name: Verify social database RLS invariants
      run: npm run security:social-rls
    - name: Build all workspaces
      run: npm run build --if-present
    - name: Run test suite
      run: npm test
