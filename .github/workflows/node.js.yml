# This workflow performs installation, security scan, build and tests.
# NOTE: package-lock.json is currently out of sync with the workspace manifests.
# Use npm install temporarily so security/build validation can continue; restore
# npm ci once the lockfile is regenerated and committed deterministically.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies (temporary lockfile-repair mode)
      run: npm install --no-audit --no-fund
    - name: Scan tracked source for privileged credentials
      run: npm run security:secrets
    - run: npm run build --if-present
    - run: npm test
