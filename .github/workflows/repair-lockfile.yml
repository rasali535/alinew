name: Repair npm lockfile

on:
  push:
    branches:
      - security/p0-secret-purge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-secret-purge
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Regenerate package-lock.json only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile on Node 22"
          git push origin HEAD:security/p0-secret-purge
