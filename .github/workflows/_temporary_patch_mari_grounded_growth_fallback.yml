name: Temporary patch Mari grounded Growth fallback

on:
  push:
    branches:
      - fix/mari-grounded-growth-fallback
    paths:
      - .github/workflows/_temporary_patch_mari_grounded_growth_fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-grounded-growth-fallback
          fetch-depth: 0
      - name: Patch Mari grounded Growth fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Give Gemini enough bounded time for evidence-heavy strategy prompts,
          # while using low thinking for Gemini 3.x to keep latency predictable.
          core = Path('packages/ai/src/mariUniversalCore.ts')
          src = core.read_text()
          old = "const MARI_RESPONSE_PROVIDER_BUDGET_MS = Math.max(2500, Number(process.env.MARI_RESPONSE_PROVIDER_BUDGET_MS || 7000));"
          new = "const MARI_RESPONSE_PROVIDER_BUDGET_MS = Math.max(5000, Number(process.env.MARI_RESPONSE_PROVIDER_BUDGET_MS || 12000));"
          if old not in src:
              raise SystemExit('response provider budget anchor not found')
          src = src.replace(old, new, 1)

          old = """    try {\n      const response = await fetch(url, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig: {\n            temperature: 0.4,\n            maxOutputTokens: 1500,\n          },\n        }),\n        signal: AbortSignal.timeout(remainingProviderMs),\n      });"""
          new = """    try {\n      const generationConfig: Record<string, any> = { maxOutputTokens: 1800 };\n      if (/^gemini-3(?:\\.|-)/i.test(modelName)) {\n        generationConfig.thinkingConfig = { thinkingLevel: 'low' };\n      }\n      const response = await fetch(url, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({\n          systemInstruction: {\n            parts: [{ text: systemInstruction }],\n          },\n          contents,\n          generationConfig,\n        }),\n        signal: AbortSignal.timeout(remainingProviderMs),\n      });"""
          if old not in src:
              raise SystemExit('neural generation config anchor not found')
          src = src.replace(old, new, 1)
          core.write_text(src)

          # 2) Make the Facebook Growth route self-sufficient when the reasoning provider
          # times out: load stored competitive intelligence + learning evidence and build
          # a deterministic strategy from tenant evidence instead of a dead-end retry message.
          route = Path('apps/ralion/src/app/api/social/facebook/pages/[pageId]/mari-growth/route.ts')
          src = route.read_text()

          import_anchor = "import { MariBusinessIntelligenceService } from '@/lib/services/mari/mariBusinessIntelligence.service';"
          import_new = import_anchor + "\nimport { MariCompetitiveIntelligenceService } from '@/lib/services/mari/mariCompetitiveIntelligence.service';\nimport { MariMarketingLearningService } from '@/lib/services/mari/mariMarketingLearning.service';"
          if import_anchor not in src:
              raise SystemExit('route import anchor not found')
          src = src.replace(import_anchor, import_new, 1)

          dynamic_anchor = "export const dynamic = 'force-dynamic';\n"
          helper = r'''

function buildGroundedGrowthStrategyFallback(params: {
  companyName: string;
  businessIntelligence: any;
  competitiveIntelligence: any;
  marketingLearnings: any[];
}): string {
  const bi = params.businessIntelligence || {};
  const profile = bi.businessProfile || {};
  const facebook = bi.facebookIntelligence || {};
  const performance = bi.contentPerformance || {};
  const audience = bi.audienceIntelligence || {};
  const period = bi.period || {};
  const competition = params.competitiveIntelligence || {};
  const watchlist = Array.isArray(competition.watchlist) ? competition.watchlist.filter((item: any) => item?.status === 'ACTIVE') : [];
  const observations = Array.isArray(competition.recentObservations) ? competition.recentObservations : [];
  const briefing = competition.latestBriefing || null;
  const learnings = Array.isArray(params.marketingLearnings) ? params.marketingLearnings : [];
  const company = profile.companyName || params.companyName || 'your business';

  const evidence: string[] = [];
  if (profile.industry) evidence.push(`- **Business profile:** ${company} operates in ${profile.industry}.`);
  else evidence.push(`- **Business profile:** ${company} is the verified tenant business.`);
  if (profile.valueProposition) evidence.push(`- **Value proposition on record:** ${profile.valueProposition}`);
  if (Array.isArray(profile.productsAndServices) && profile.productsAndServices.length) {
    evidence.push(`- **Products/services on record:** ${profile.productsAndServices.slice(0, 6).join(', ')}.`);
  }
  if (period.start && period.end) {
    evidence.push(`- **Measured Facebook period:** ${String(period.start).slice(0, 10)} to ${String(period.end).slice(0, 10)}.`);
  }
  if (facebook.connected) {
    evidence.push(`- **Facebook Page:** ${facebook.pageName || 'Connected Page'}${facebook.followers != null ? ` with ${facebook.followers} followers` : ''}.`);
  }
  evidence.push(`- **Publishing baseline:** ${Number(performance.posts30d || 0)} posts in 30 days (about ${Number(performance.postingFrequencyPerWeek || 0).toFixed(2)} per week).`);
  const interactions = Number(performance.totalReactions30d || 0) + Number(performance.totalComments30d || 0) + Number(performance.totalShares30d || 0);
  evidence.push(`- **Visible interactions:** ${interactions} total (${Number(performance.totalReactions30d || 0)} reactions, ${Number(performance.totalComments30d || 0)} comments, ${Number(performance.totalShares30d || 0)} shares).`);
  if (performance.totalReach30d != null) {
    evidence.push(`- **Measured reach:** ${performance.totalReach30d}${performance.engagementRatePct != null ? `; engagement rate ${performance.engagementRatePct}%` : ''}.`);
  } else {
    evidence.push('- **Reach/engagement-rate limitation:** reliable reach is unavailable, so a reach-based engagement rate cannot be claimed.');
  }
  if (performance.topContentType) {
    evidence.push(`- **Observed format signal:** ${performance.topContentType} has the highest observed average engagement in this sample. This is a signal to test, not proof that the format is universally best.`);
  }
  const topPost = Array.isArray(performance.topPosts) ? performance.topPosts[0] : null;
  if (topPost) {
    evidence.push(`- **Top observed post in the window:** “${String(topPost.excerpt || '').slice(0, 180)}” with ${Number(topPost.engagement || 0)} visible interactions.`);
  }
  if (audience.commentsSampled != null) {
    evidence.push(`- **Audience evidence:** ${Number(audience.commentsSampled || 0)} comments sampled${audience.responseCoveragePct != null ? `; reply coverage ${audience.responseCoveragePct}%` : ''}.`);
  }

  const competitorLines: string[] = [];
  if (watchlist.length) {
    competitorLines.push(`- **Public competitor watchlist:** ${watchlist.map((item: any) => item.name).join(', ')}.`);
    competitorLines.push(`- **Evidence ledger:** ${observations.length} recent public-source observations are available.`);
    if (briefing?.summary) competitorLines.push(`- **Latest market briefing:** ${briefing.summary}`);
    if (Array.isArray(briefing?.marketMoves) && briefing.marketMoves.length) {
      competitorLines.push(`- **Observed market moves:** ${briefing.marketMoves.slice(0, 3).join(' | ')}`);
    }
    if (Array.isArray(briefing?.marketGaps) && briefing.marketGaps.length) {
      competitorLines.push(`- **Potential gaps to test:** ${briefing.marketGaps.slice(0, 3).join(' | ')}`);
    }
  } else {
    competitorLines.push('- No verified competitor observations are currently available in the tenant ledger, so no competitor-specific claim is made.');
  }

  const learningLines = learnings.length
    ? learnings.slice(0, 5).map((learning: any) => `- **${learning.status || 'EVIDENCE'} (${Math.round(Number(learning.confidence || 0) * 100)}% confidence; n=${Number(learning.evidenceCount || 0)}):** ${learning.claim}`)
    : ['- No evidence-backed historical marketing learnings exist yet. New campaigns should be treated as baseline experiments, not as proven playbooks.'];

  const gaps: string[] = [];
  if (performance.totalReach30d == null) gaps.push('- Reach/impression evidence is insufficient for reliable reach-based engagement comparisons.');
  gaps.push('- Historical follower snapshots are insufficient for a verified 30-day follower-growth rate.');
  if (Number(audience.customerCommentsSampled || 0) < 10) gaps.push(`- Customer-intent evidence is thin (${Number(audience.customerCommentsSampled || 0)} customer comments sampled), so audience pain-point conclusions would be premature.`);
  if (!learnings.length) gaps.push('- There is not yet enough matched experiment/outcome history to claim a repeatable winning content pattern.');
  if (!observations.length) gaps.push('- Competitor conclusions are limited until more public observations are collected.');

  const marketGap = Array.isArray(briefing?.marketGaps) && briefing.marketGaps.length ? String(briefing.marketGaps[0]) : '';
  const observedFormat = performance.topContentType || 'text';

  const tests = [
    `1. **Positioning test:** Test ${company}'s combination of creative production and intelligent software/business systems as a differentiation hypothesis${marketGap ? `, informed by this public-market gap: ${marketGap}` : ''}. Compare it with a simpler single-service message; do not assume the hybrid message wins until measured.`,
    `2. **Format test:** Use the observed ${observedFormat} signal as one variant, then test it against a different format with the same message and CTA. Hold the offer constant so the format comparison is interpretable.`,
    `3. **CTA test:** Compare a low-friction conversation CTA (for example, asking people to comment a keyword) with the current direct-contact path. Measure qualified replies or enquiries rather than raw reactions alone.`,
  ];

  const contentFormat = observedFormat === 'video' ? 'Short video/reel with a concise text caption' : observedFormat === 'image' ? 'Single visual with a concise proof-led caption' : 'Text-first milestone / behind-the-scenes post';
  const contentIdea = [
    `**Objective:** Test whether the creative + intelligent-systems positioning earns meaningful enquiries.`,
    `**Format:** ${contentFormat}.`,
    `**Draft copy:**`,
    '',
    `What changes when creative production and business technology stop working in separate lanes?`,
    '',
    `At ${company}, we’re building that answer in practice — combining creative work with intelligent systems such as Ralion OS so a campaign can connect more directly to how a business operates, learns and grows.`,
    '',
    `We’re testing this approach openly rather than calling it proven before the data says so.`,
    '',
    `Want to see one workflow in action? Comment **BUILD** and we’ll show you the idea behind it.`,
  ].join('\n');

  return [
    `## Marketing Strategy for ${company}`,
    '',
    '_Grounded fallback mode: the live reasoning provider did not return in time, so this answer uses stored tenant evidence only. No missing metric or competitor result is invented._',
    '',
    '### 1. Evidence We Have',
    ...evidence,
    '',
    '#### Public Competitor Intelligence',
    ...competitorLines,
    '',
    '#### Historical Marketing Learning',
    ...learningLines,
    '',
    '### 2. What We Do Not Have Enough Evidence For',
    ...gaps,
    '',
    '### 3. What We Should Test Next',
    ...tests,
    '',
    '### 4. Facebook Content Idea',
    contentIdea,
  ].join('\n');
}
'''
          if dynamic_anchor not in src:
              raise SystemExit('dynamic route anchor not found')
          src = src.replace(dynamic_anchor, dynamic_anchor + helper, 1)

          state_anchor = "      let businessContext: any = null;\n      let businessIntelligence: any = null;\n      let facebookPosts: any[] = [];"
          state_new = state_anchor + "\n      let competitiveIntelligence: any = null;\n      let marketingLearnings: any[] = [];"
          if state_anchor not in src:
              raise SystemExit('route state anchor not found')
          src = src.replace(state_anchor, state_new, 1)

          bi_catch = """      } catch (intelligenceError: any) {\n        console.warn('[Mari Growth API] Business intelligence notice:', intelligenceError?.message || intelligenceError);\n      }\n\n      const exactPageEvidence = ["""
          evidence_load = """      } catch (intelligenceError: any) {\n        console.warn('[Mari Growth API] Business intelligence notice:', intelligenceError?.message || intelligenceError);\n      }\n\n      const tenantEvidenceParams = { organizationId, workspaceId, userId };\n      const [competitiveResult, learningResult] = await Promise.allSettled([\n        MariCompetitiveIntelligenceService.getSnapshot(tenantEvidenceParams),\n        MariMarketingLearningService.listLearnings(tenantEvidenceParams, 10),\n      ]);\n      if (competitiveResult.status === 'fulfilled') {\n        competitiveIntelligence = competitiveResult.value;\n      } else {\n        console.warn('[Mari Growth API] Competitive intelligence notice:', competitiveResult.reason?.message || competitiveResult.reason);\n      }\n      if (learningResult.status === 'fulfilled') {\n        marketingLearnings = learningResult.value;\n      } else {\n        console.warn('[Mari Growth API] Marketing learning notice:', learningResult.reason?.message || learningResult.reason);\n      }\n\n      const exactPageEvidence = ["""
          if bi_catch not in src:
              raise SystemExit('business intelligence completion anchor not found')
          src = src.replace(bi_catch, evidence_load, 1)

          result_anchor = """      const firstAction = Array.isArray(result.suggestedActions) ? result.suggestedActions[0] : undefined;\n      return corsJsonResponse({\n        success: true,\n        chat: {\n          answer: sanitizeMariModelOutput(result.answer),"""
          result_new = """      const genericUnavailable = /reasoning engine is temporarily unavailable/i.test(String(result.answer || ''));\n      const shouldUseGroundedRouteFallback = genericUnavailable || (!result.modelSucceeded && result.detectedIntent === 'FACEBOOK_INSIGHTS');\n      const finalAnswer = shouldUseGroundedRouteFallback\n        ? buildGroundedGrowthStrategyFallback({ companyName, businessIntelligence, competitiveIntelligence, marketingLearnings })\n        : result.answer;\n\n      const firstAction = Array.isArray(result.suggestedActions) ? result.suggestedActions[0] : undefined;\n      return corsJsonResponse({\n        success: true,\n        chat: {\n          answer: sanitizeMariModelOutput(finalAnswer),"""
          if result_anchor not in src:
              raise SystemExit('route result anchor not found')
          src = src.replace(result_anchor, result_new, 1)

          telemetry_anchor = """            responseSource: result.responseSource,\n            modelSucceeded: result.modelSucceeded,\n            businessIntelligenceLoaded: Boolean(businessIntelligence),\n            buildVersion: MARI_BUILD_VERSION,\n            outputSanitizer: 'MARI_UNIVERSAL_V2',"""
          telemetry_new = """            responseSource: shouldUseGroundedRouteFallback ? 'local_grounded_route' : result.responseSource,\n            modelSucceeded: result.modelSucceeded,\n            actualModelUsed: result.actualModelUsed || null,\n            fallbackReason: result.fallbackReason || null,\n            modelFailureCodes: result.modelFailureCodes || {},\n            groundedGrowthFallbackUsed: shouldUseGroundedRouteFallback,\n            businessIntelligenceLoaded: Boolean(businessIntelligence),\n            competitiveIntelligenceLoaded: Boolean(competitiveIntelligence),\n            marketingLearningCount: marketingLearnings.length,\n            buildVersion: MARI_BUILD_VERSION,\n            outputSanitizer: 'MARI_UNIVERSAL_V2',"""
          if telemetry_anchor not in src:
              raise SystemExit('route telemetry anchor not found')
          src = src.replace(telemetry_anchor, telemetry_new, 1)

          route.write_text(src)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/mariUniversalCore.ts apps/ralion/src/app/api/social/facebook/pages/'[pageId]'/mari-growth/route.ts
          git diff --cached --check
          git commit -m "fix(mari): add evidence-backed Growth fallback"
          git push origin HEAD:fix/mari-grounded-growth-fallback
