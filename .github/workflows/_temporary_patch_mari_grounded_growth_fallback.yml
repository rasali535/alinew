name: Temporary patch Mari grounded Growth fallback

on:
  push:
    branches:
      - fix/mari-grounded-growth-fallback
    paths:
      - .github/workflows/_temporary_patch_mari_grounded_growth_fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mari-grounded-growth-fallback
          fetch-depth: 0
      - name: Patch Mari grounded Growth fallback
        env:
          PATCH_GZ_B64: ""
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai/src/mariUniversalCore.ts apps/ralion/src/app/'(dashboard)'/growth/page.tsx apps/ralion/src/app/api/social/facebook/pages/'[pageId]'/mari-growth/route.ts
          git diff --cached --check
          git commit -m "fix(mari): add evidence-backed Growth fallback"
          git push origin HEAD:fix/mari-grounded-growth-fallback
