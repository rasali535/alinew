name: Ralion OS Desktop

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/desktop/**"
      - "apps/ralion/**"
      - "packages/ui/**"
      - "packages/auth/**"
      - ".github/workflows/ralion-os-desktop.yml"
  workflow_dispatch:

concurrency:
  group: ralion-os-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build desktop renderer and Electron shell
        run: npm run desktop:build

      - name: Verify packaged runtime configuration
        run: node apps/desktop/scripts/verify-runtime-config.js

      - name: Package Windows x64 installer
        run: npm run desktop:dist:win

      - name: Validate Windows installer
        run: npm run validate --workspace=@ralion/desktop

      - name: Upload Ralion OS installer
        uses: actions/upload-artifact@v4
        with:
          name: ralion-os-windows-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
