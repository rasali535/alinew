# ============================================================
# Nginx main reverse proxy for Rasali Labs
# Routes all traffic from ports 80/443 to internal containers
# ============================================================

upstream website_upstream {
    server website:80;
}

upstream ralion_upstream {
    server ralion:3000;
}

upstream backend_upstream {
    server backend:4000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rasalilabs.com www.rasalilabs.com localhost 127.0.0.1;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Max upload size (for media uploads in Ralion)
    client_max_body_size 50M;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── /ralion → Next.js Ralion Dashboard (Standalone server) ──
    location /ralion {
        proxy_pass         http://ralion_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # ── /api → Chatbot Backend API ───────────────────────────
    location /api {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── / → Marketing Website (Vite + Nginx) ──────────────────
    location / {
        proxy_pass         http://website_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
