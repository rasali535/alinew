# ============================================================
# Nginx main reverse proxy for Rasali Labs on VPS
# Routes all traffic from ports 80/443 to internal containers
# ============================================================

# Upstream container addresses (Docker internal DNS)
upstream website_upstream {
    server website:80;
}

upstream ralion_upstream {
    server ralion:3000;
}

upstream backend_upstream {
    server backend:4000;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name rasalilabs.com www.rasalilabs.com;

    # Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name rasalilabs.com www.rasalilabs.com;

    # SSL Certificates (managed by Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/rasalilabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rasalilabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    # Max upload size (for media uploads in Ralion)
    client_max_body_size 50M;

    # ── /ralion/ → Next.js Ralion Dashboard ──────────────────
    location /ralion/ {
        proxy_pass         http://ralion_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Next.js static assets (fast cache)
    location /ralion/_next/static/ {
        proxy_pass         http://ralion_upstream;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── /api/ → Chatbot Backend ───────────────────────────────
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── / → Marketing Website ────────────────────────────────
    location / {
        proxy_pass         http://website_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA fallback — serve index.html for React Router routes
        proxy_intercept_errors on;
        error_page 404 = @website_fallback;
    }

    location @website_fallback {
        proxy_pass http://website_upstream/index.html;
    }
}
