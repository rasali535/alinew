appId: com.rasalilabs.ralion
productName: Ralion OS
copyright: Copyright © 2026 Ras Ali Labs

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - dist/renderer/**/*
  - node_modules/**/*
  - package.json

# ── Windows x64 NSIS Installer ────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  publisherName: Ras Ali Labs
  verifyUpdateCodeSignature: false
  artifactName: "ralion-os-${version}-setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ralion OS
  artifactName: "ralion-os-${version}-setup.${ext}"

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.business
  artifactName: "ralion-os-${version}-${arch}.${ext}"

dmg:
  title: Ralion OS ${version}
  icon: assets/icon.icns

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Office
  maintainer: Ras Ali Labs <support@rasalilabs.com>
  artifactName: "ralion-os-${version}-${arch}.${ext}"

# ── Auto Update ───────────────────────────────────────────────────────────────
publish:
  provider: generic
  url: https://rasalilabs.com/ralion/api/version/releases

extraMetadata:
  main: dist/main.js
