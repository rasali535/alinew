<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ptCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- Tech Monogram Emblem -->
  <g transform="translate(20, 16)">
    <rect x="4" y="4" width="60" height="60" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <!-- P & T Circuit Topology -->
    <path d="M22 20 H40 C45 20, 48 24, 48 28 C48 32, 45 36, 40 36 H22 V48" stroke="url(#ptGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 36 V48" stroke="url(#ptCyan)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="28" r="2.5" fill="#F59E0B"/>
    <circle cx="22" cy="48" r="2.5" fill="#06B6D4"/>
  </g>
  <!-- Wordmark -->
  <text x="96" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    PAMEL<tspan fill="#F59E0B">TECH</tspan>
  </text>
  <text x="96" y="64" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
    LABS &amp; INNOVATION
  </text>
</svg>
